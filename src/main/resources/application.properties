spring.application.name=agenda-contatos

# H2 em memória (some ao reiniciar); troque por Postgres para persistir
spring.datasource.url=jdbc:h2:mem:agenda;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
